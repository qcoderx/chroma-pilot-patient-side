<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChromaPilot - Phenotype Calibration</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Theme Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#36e27b",
            "bond-blue": "#00C2FF",
            "helix-violet": "#7000FF",
            "deep-indigo": "#0B0A12",
            "background-light": "#f6f8f7",
            "background-dark": "#000000",
            "mutation-magenta": "#FF2A00",
            "biolum-cyan": "#00F0FF",
            "surface-dark": "#0a0a0a",
            "surface-accent": "#111111",
            "success": "#00ff9d",
            "critical-red": "#FF2A00",
            "amber-500": "#f59e0b",
          },
          fontFamily: {
            "display": ["Spline Sans", "sans-serif"],
            "mono-display": ["Space Grotesk", "sans-serif"],
            "body": ["Noto Sans", "sans-serif"],
          },
          borderRadius: {
            "lg": "1.5rem",
            "xl": "2rem",
            "2xl": "2.5rem",
            "3xl": "3rem",
          },
          boxShadow: {
            "neon-violet": "0 0 15px rgba(112, 0, 255, 0.4)",
            "neon-blue": "0 0 15px rgba(0, 194, 255, 0.3)",
            "neon-green": "0 0 15px rgba(54, 226, 123, 0.4)",
            "neon-magenta": "0 0 10px rgba(255, 42, 0, 0.5), 0 0 20px rgba(255, 42, 0, 0.3)",
            "glass": "0 4px 30px rgba(0, 0, 0, 0.1)",
            "critical": "0 0 15px rgba(255, 42, 0, 0.4)",
          },
          animation: {
            'hologram': 'pulse-hologram 4s infinite ease-in-out',
            'spin-slow': 'spin 10s linear infinite',
            'spin-reverse': 'spin 15s linear infinite reverse',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fadeIn': 'fadeIn 0.5s ease-out forwards',
            'slideUp': 'slideUp 0.5s ease-out forwards',
            'twinkle': 'twinkle 2s ease-in-out infinite',
            'flyAcross': 'flyAcross 15s linear infinite',
            'flyAcrossReverse': 'flyAcrossReverse 18s linear infinite',
            'orbit': 'orbit 20s linear infinite',
            'orbitReverse': 'orbitReverse 25s linear infinite',
            'float': 'float 3s ease-in-out infinite',
            'confetti': 'confetti 3s ease-out forwards',
            'shootingStar': 'shootingStar 2s ease-out forwards',
            'levelUp': 'levelUp 0.6s ease-out forwards',
            'bounce-slow': 'bounce 2s infinite',
            'wiggle': 'wiggle 1s ease-in-out infinite',
            'glow': 'glow 2s ease-in-out infinite',
            'shimmer': 'shimmer 2s infinite',
            'xpFloat': 'xpFloat 1.2s ease-out forwards',
            'particleBurst': 'particleBurst 0.8s ease-out forwards',
            'comboShake': 'comboShake 0.5s ease-in-out',
            'springBounce': 'springBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)',
            'slideInRight': 'slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slideInLeft': 'slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'popIn': 'popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
            'streakFire': 'streakFire 0.8s ease-in-out infinite',
            'gradient': 'gradient 3s ease infinite',
            'countUp': 'countUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-ring': 'pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'success-check': 'success-check 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
          },
          keyframes: {
            'pulse-hologram': {
              '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.02)' },
            },
            'fadeIn': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            'slideUp': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'twinkle': {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.5)' },
            },
            'flyAcross': {
              '0%': { left: '-10%', opacity: '0' },
              '10%': { opacity: '1' },
              '90%': { opacity: '1' },
              '100%': { left: '110%', opacity: '0' },
            },
            'flyAcrossReverse': {
              '0%': { right: '-10%', opacity: '0' },
              '10%': { opacity: '1' },
              '90%': { opacity: '1' },
              '100%': { right: '110%', opacity: '0' },
            },
            'orbit': {
              '0%': { transform: 'translate(-50%, -50%) rotate(0deg)' },
              '100%': { transform: 'translate(-50%, -50%) rotate(360deg)' },
            },
            'orbitReverse': {
              '0%': { transform: 'translate(-50%, -50%) rotate(360deg)' },
              '100%': { transform: 'translate(-50%, -50%) rotate(0deg)' },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            'confetti': {
              '0%': { transform: 'translateY(0) rotate(0deg)', opacity: '1' },
              '100%': { transform: 'translateY(100vh) rotate(720deg)', opacity: '0' },
            },
            'shootingStar': {
              '0%': { transform: 'translateX(0) translateY(0)', opacity: '1' },
              '100%': { transform: 'translateX(200px) translateY(200px)', opacity: '0' },
            },
            'levelUp': {
              '0%': { transform: 'scale(0.5)', opacity: '0' },
              '50%': { transform: 'scale(1.2)' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'wiggle': {
              '0%, 100%': { transform: 'rotate(-3deg)' },
              '50%': { transform: 'rotate(3deg)' },
            },
            'glow': {
              '0%, 100%': { boxShadow: '0 0 20px rgba(54, 226, 123, 0.4)' },
              '50%': { boxShadow: '0 0 40px rgba(54, 226, 123, 0.8)' },
            },
            'shimmer': {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' },
            },
            'ripple': {
              '0%': { transform: 'scale(0)', opacity: '1' },
              '100%': { transform: 'scale(40)', opacity: '0' },
            },
            'slideInUp': {
              '0%': { transform: 'translateY(100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            'slideOutDown': {
              '0%': { transform: 'translateY(0)', opacity: '1' },
              '100%': { transform: 'translateY(100%)', opacity: '0' },
            },
            'scaleIn': {
              '0%': { transform: 'scale(0.9)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'heartbeat': {
              '0%, 100%': { transform: 'scale(1)' },
              '25%': { transform: 'scale(1.1)' },
              '50%': { transform: 'scale(1)' },
              '75%': { transform: 'scale(1.05)' },
            },
            'xpFloat': {
              '0%': { transform: 'translateY(0) scale(0.5)', opacity: '0' },
              '20%': { transform: 'translateY(-20px) scale(1.2)', opacity: '1' },
              '100%': { transform: 'translateY(-80px) scale(1)', opacity: '0' },
            },
            'particleBurst': {
              '0%': { transform: 'translate(-50%, -50%) rotate(var(--particle-angle)) translateX(0)', opacity: '1' },
              '100%': { transform: 'translate(-50%, -50%) rotate(var(--particle-angle)) translateX(var(--particle-distance))', opacity: '0' },
            },
            'comboShake': {
              '0%, 100%': { transform: 'translateX(0)' },
              '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-2px)' },
              '20%, 40%, 60%, 80%': { transform: 'translateX(2px)' },
            },
            'springBounce': {
              '0%': { transform: 'scale(1)' },
              '30%': { transform: 'scale(0.95)' },
              '50%': { transform: 'scale(1.05)' },
              '70%': { transform: 'scale(0.98)' },
              '100%': { transform: 'scale(1)' },
            },
            'slideInRight': {
              '0%': { transform: 'translateX(100%)', opacity: '0' },
              '100%': { transform: 'translateX(0)', opacity: '1' },
            },
            'slideInLeft': {
              '0%': { transform: 'translateX(-100%)', opacity: '0' },
              '100%': { transform: 'translateX(0)', opacity: '1' },
            },
            'popIn': {
              '0%': { transform: 'scale(0)', opacity: '0' },
              '50%': { transform: 'scale(1.1)' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'streakFire': {
              '0%, 100%': { transform: 'scale(1) rotate(-5deg)' },
              '25%': { transform: 'scale(1.1) rotate(5deg)' },
              '50%': { transform: 'scale(1.05) rotate(-3deg)' },
              '75%': { transform: 'scale(1.15) rotate(3deg)' },
            },
            'gradient': {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            },
            'countUp': {
              '0%': { transform: 'translateY(100%)', opacity: '0' },
              '50%': { transform: 'translateY(-10%)', opacity: '1' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            'pulse-ring': {
              '0%': { transform: 'scale(0.8)', opacity: '1' },
              '100%': { transform: 'scale(2)', opacity: '0' },
            },
            'success-check': {
              '0%': { transform: 'scale(0) rotate(-45deg)', opacity: '0' },
              '50%': { transform: 'scale(1.2) rotate(-45deg)' },
              '100%': { transform: 'scale(1) rotate(-45deg)', opacity: '1' },
            },
          },
          backgroundSize: {
            'gradient-animate': '200% 200%',
          },
        },
      },
    }
  </script>
  <style>
    /* Utilities */
    body {
      background-color: #000000;
      color: white;
      min-height: 100vh;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Glitch Effect */
    .glitch-text {
      position: relative;
      animation: glitch-skew 1s infinite linear alternate-reverse;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch-text::before {
      left: 2px;
      text-shadow: -1px 0 #FF2A00;
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim 5s infinite linear alternate-reverse;
    }

    .glitch-text::after {
      left: -2px;
      text-shadow: -1px 0 #00F0FF;
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim2 5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% {
        clip: rect(14px, 9999px, 81px, 0);
      }

      20% {
        clip: rect(78px, 9999px, 14px, 0);
      }

      40% {
        clip: rect(16px, 9999px, 59px, 0);
      }

      60% {
        clip: rect(4px, 9999px, 86px, 0);
      }

      80% {
        clip: rect(35px, 9999px, 20px, 0);
      }

      100% {
        clip: rect(69px, 9999px, 3px, 0);
      }
    }

    @keyframes glitch-anim2 {
      0% {
        clip: rect(65px, 9999px, 10px, 0);
      }

      20% {
        clip: rect(5px, 9999px, 63px, 0);
      }

      40% {
        clip: rect(35px, 9999px, 5px, 0);
      }

      60% {
        clip: rect(83px, 9999px, 78px, 0);
      }

      80% {
        clip: rect(5px, 9999px, 26px, 0);
      }

      100% {
        clip: rect(27px, 9999px, 64px, 0);
      }
    }

    /* Range Input Styling for Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 56px;
      width: 56px;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      margin-top: 0px;
      position: relative;
      z-index: 20;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 64px;
      cursor: pointer;
      background: transparent;
      border-radius: 9999px;
    }
  </style>
