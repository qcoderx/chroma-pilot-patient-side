<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chroma-Pilot Bio-Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Theme Config -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#36e27b",
              "bond-blue": "#00C2FF",
              "helix-violet": "#7000FF",
              "deep-indigo": "#0B0A12",
              "background-light": "#f6f8f7",
              "background-dark": "#0B0A12",
              "mutation-magenta": "#FF2A00",
              "biolum-cyan": "#00F0FF",
              "surface-dark": "#131620",
              "surface-accent": "#1A2235",
              "success": "#00ff9d",
              "critical-red": "#FF2A00",
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"],
              "mono-display": ["Space Grotesk", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            borderRadius: {
              "lg": "1.5rem",
              "xl": "2rem",
              "2xl": "2.5rem",
              "3xl": "3rem",
            },
            boxShadow: {
              "neon-violet": "0 0 15px rgba(112, 0, 255, 0.4)",
              "neon-blue": "0 0 15px rgba(0, 194, 255, 0.3)",
              "neon-magenta": "0 0 10px rgba(255, 42, 0, 0.5), 0 0 20px rgba(255, 42, 0, 0.3)",
              "glass": "0 4px 30px rgba(0, 0, 0, 0.1)",
              "critical": "0 0 15px rgba(255, 42, 0, 0.4)",
            },
            animation: {
              'hologram': 'pulse-hologram 4s infinite ease-in-out',
              'spin-slow': 'spin 10s linear infinite',
              'spin-reverse': 'spin 15s linear infinite reverse',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              'pulse-hologram': {
                '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
                '50%': { opacity: '1', transform: 'scale(1.02)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Utilities */
      body {
        background-color: #0B0A12;
        color: white;
        min-height: 100vh;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Glitch Effect */
      .glitch-text {
        position: relative;
        animation: glitch-skew 1s infinite linear alternate-reverse;
      }
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -1px 0 #FF2A00;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -1px 0 #00F0FF;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim2 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(14px, 9999px, 81px, 0); }
        20% { clip: rect(78px, 9999px, 14px, 0); }
        40% { clip: rect(16px, 9999px, 59px, 0); }
        60% { clip: rect(4px, 9999px, 86px, 0); }
        80% { clip: rect(35px, 9999px, 20px, 0); }
        100% { clip: rect(69px, 9999px, 3px, 0); }
      }
      @keyframes glitch-anim2 {
        0% { clip: rect(65px, 9999px, 10px, 0); }
        20% { clip: rect(5px, 9999px, 63px, 0); }
        40% { clip: rect(35px, 9999px, 5px, 0); }
        60% { clip: rect(83px, 9999px, 78px, 0); }
        80% { clip: rect(5px, 9999px, 26px, 0); }
        100% { clip: rect(27px, 9999px, 64px, 0); }
      }
      
      /* Range Input Styling for Slider */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 56px;
        width: 56px;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        margin-top: 0px; 
        position: relative;
        z-index: 20;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 64px;
        cursor: pointer;
        background: transparent;
        border-radius: 9999px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "recharts": "https://esm.sh/recharts@2.12.3?external=react,react-dom",
    "react/": "https://esm.sh/react@18.2.0/",
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.2.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
